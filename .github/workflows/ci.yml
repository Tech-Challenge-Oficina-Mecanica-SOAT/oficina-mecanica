name: CI/CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/oficina-mecanica-api

jobs:

  # ─── Job 1: Build & Test (roda em PR e push) ──────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore OficinaMecanica.slnx

      - name: Build
        run: dotnet build OficinaMecanica.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test OficinaMecanica.slnx --no-build --configuration Release --verbosity normal

  # ─── Job 2: Build e push da imagem Docker (só no push para main) ──
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadata da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ─── Job 3: Deploy do banco no cluster (só no push para main) ─────
  deploy-banco:
    name: Deploy Postgres no Cluster
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar cluster Kind
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: oficina-mecanica

      - name: Aplicar manifestos do Postgres
        run: |
          kubectl apply -f k8s/postgres-pvc.yaml
          kubectl apply -f k8s/postgres-deployment.yaml
          kubectl apply -f k8s/postgres-service.yaml

      - name: Aguardar Postgres ficar pronto
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=postgres \
            --timeout=120s

  # ─── Job 4: Deploy da API no cluster (só no push para main) ───────
  deploy-api:
    name: Deploy API no Cluster
    runs-on: ubuntu-latest
    needs: deploy-banco
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar cluster Kind (reuso)
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: oficina-mecanica

      - name: Aplicar ConfigMap e Secret
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml

      - name: Substituir tag da imagem no manifesto
        run: |
          IMAGE_TAG=sha-${{ github.sha }}
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG::7}|g" k8s/api-deployment.yaml

      - name: Aplicar manifestos da API
        run: |
          kubectl apply -f k8s/api-deployment.yaml
          kubectl apply -f k8s/api-service.yaml
          kubectl apply -f k8s/api-hpa.yaml

      - name: Aguardar API ficar pronta
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=oficina-mecanica-api \
            --timeout=180s

      - name: Smoke test
        run: |
          kubectl port-forward svc/oficina-mecanica-api 8080:80 &
          sleep 5
          curl --fail http://localhost:8080/health || echo "Health check falhou"