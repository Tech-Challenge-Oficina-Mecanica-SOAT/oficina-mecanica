apiVersion: v1
kind: Secret
metadata:
  name: oficina-mecanica-secret
type: Opaque
# Valores devem ser base64. Para gerar: echo -n "valor" | base64
# Substitua os valores abaixo pelos reais antes de aplicar
stringData:
  Jwt__SecretKey: "TROQUE_POR_SUA_SECRET_KEY_COM_MINIMO_32_CARACTERES"
  Seguranca__PasswordKey: "TROQUE_POR_SUA_PASSWORD_KEY"
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=OficinaDB;Username=postgres;Password=TROQUE_POR_SUA_SENHA"
