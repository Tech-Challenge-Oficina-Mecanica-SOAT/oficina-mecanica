version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: oficina_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: OficinaDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SuaSenha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: oficina_api:latest
    container_name: oficina_api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=OficinaDB;Username=postgres;Password=SuaSenha
    restart: unless-stopped

volumes:
  postgres_data: {}
